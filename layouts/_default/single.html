{{ define "main" }}
  <a href="{{ "" | relURL }}">&larr; Posts</a>
  <article class="justify">
    <div class="mb2">
      <h2 class="h3 mb0"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <time class="grayish" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    </div>
    {{ with .Params.photo }}<img src="{{ strings.TrimPrefix "/" . | relURL }}" alt="{{ $.Title }}">{{ end }}
    {{ .Content }}
  </article>
  {{ if eq .Section "posts" }}{{ partial "post-pagination.html" . }}{{ end }}
{{ end }}
